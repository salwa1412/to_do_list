<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>To Do List App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">

    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <div class="logo">✦ Taskly</div>
        <p class="tagline">Atur harimu, capai tujuanmu.</p>
      </div>
      <button class="btn-dark-toggle" id="darkToggle" title="Toggle dark mode">🌙</button>
    </header>

    <!-- Stats Bar -->
    <div class="stats-bar" id="statsBar">
      <div class="stat-card">
        <span class="stat-num" id="statTotal">0</span>
        <span class="stat-label">Total</span>
      </div>
      <div class="stat-card">
        <span class="stat-num accent-yellow" id="statPending">0</span>
        <span class="stat-label">Pending</span>
      </div>
      <div class="stat-card">
        <span class="stat-num accent-blue" id="statProgress">0</span>
        <span class="stat-label">On Progress</span>
      </div>
      <div class="stat-card">
        <span class="stat-num accent-green" id="statDone">0</span>
        <span class="stat-label">Selesai</span>
      </div>
      <div class="stat-card">
        <span class="stat-num accent-red" id="statOverdue">0</span>
        <span class="stat-label">Overdue</span>
      </div>
    </div>

    <!-- Main Layout -->
    <div class="main">

      <!-- Sidebar Form -->
      <aside class="sidebar">
        <h2 class="form-title" id="formTitle">+ Tambah Task</h2>
        <form id="todoForm">
          <input type="hidden" id="editId" />

          <label>Judul Task *</label>
          <input type="text" id="inputTitle" placeholder="Apa yang perlu dilakukan?" required />

          <label>Deskripsi</label>
          <textarea id="inputDesc" placeholder="Detail tambahan..." rows="3"></textarea>

          <div class="row-2">
            <div>
              <label>Kategori</label>
              <select id="inputCategory">
                <option value="General">General</option>
                <option value="Kuliah">Kuliah</option>
                <option value="Kerja">Kerja</option>
                <option value="Pribadi">Pribadi</option>
                <option value="Belanja">Belanja</option>
                <option value="Kesehatan">Kesehatan</option>
              </select>
            </div>
            <div>
              <label>Prioritas</label>
              <select id="inputPriority">
                <option value="low">🟢 Low</option>
                <option value="medium" selected>🟡 Medium</option>
                <option value="high">🔴 High</option>
              </select>
            </div>
          </div>

          <label>Due Date</label>
          <input type="date" id="inputDueDate" />

          <label>Status</label>
          <select id="inputStatus">
            <option value="pending">⏳ Pending</option>
            <option value="in_progress">🔄 In Progress</option>
            <option value="done">✅ Done</option>
          </select>

          <div class="form-actions">
            <button type="submit" class="btn-primary" id="submitBtn">Simpan Task</button>
            <button type="button" class="btn-ghost" id="cancelBtn" style="display:none">Batal</button>
          </div>
        </form>
      </aside>

      <!-- Content Area -->
      <section class="content">

        <!-- Filter Bar -->
        <div class="filter-bar">
          <input type="text" id="searchInput" placeholder="🔍 Cari task..." />
          <select id="filterStatus">
            <option value="">Semua Status</option>
            <option value="pending">Pending</option>
            <option value="in_progress">In Progress</option>
            <option value="done">Done</option>
          </select>
          <select id="filterPriority">
            <option value="">Semua Prioritas</option>
            <option value="high">High</option>
            <option value="medium">Medium</option>
            <option value="low">Low</option>
          </select>
          <button class="btn-danger-outline" id="clearDoneBtn">🗑 Hapus Selesai</button>
        </div>

        <!-- Todo List -->
        <div id="todoList" class="todo-list">
          <div class="empty-state" id="emptyState">
            <div class="empty-icon">📋</div>
            <p>Belum ada task. Yuk tambahkan!</p>
          </div>
        </div>
      </section>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast"></div>

  <!-- Modal Edit -->
  <div id="modal" class="modal-overlay" style="display:none">
    <div class="modal">
      <h3 id="modalTitle">Detail Task</h3>
      <div id="modalContent"></div>
      <button class="btn-ghost" onclick="closeModal()">Tutup</button>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
