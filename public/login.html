```html
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Login - TaskFlow</title>

  <link rel="stylesheet" href="style.css">

  <link rel="preconnect"
    href="https://fonts.googleapis.com">

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  >
</head>

<body>

<div class="container">

  <!-- KIRI -->
  <div class="login-section">

    <div class="logo">
      <div class="logo-icon">✓</div>
      <h2>TaskFlow</h2>
    </div>

    <div class="login-content">

      <h1>Selamat Datang</h1>

      <p>
        Silakan masuk menggunakan akun Anda.
      </p>

      <form id="loginForm">

        <label>Email</label>

        <div class="input-box">
          <input
            type="email"
            id="email"
            placeholder="nama@email.com"
            required
          >
        </div>

        <label>Password</label>

        <div class="input-box">
          <input
            type="password"
            id="password"
            placeholder="Masukkan password"
            required
          >
        </div>

        <button
          type="submit"
          class="login-btn"
        >
          Masuk
        </button>

      </form>

      <p class="register">
        Belum punya akun?
        <a href="register.html">
          Daftar
        </a>
      </p>

    </div>
  </div>

  <!-- KANAN -->
  <div class="banner-section">

    <div class="banner-content">

      <h1>
        Kelola pekerjaanmu.<br>
        Fokus tanpa ribet.
      </h1>

      <p>
        TaskFlow membantu mengatur aktivitas,
        mencatat tugas, dan membuat pekerjaan
        menjadi lebih terorganisir.
      </p>

    </div>

  </div>

</div>

<script src="login.js"></script>

</body>
</html>
```
